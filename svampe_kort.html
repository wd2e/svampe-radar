
    <!DOCTYPE html>
    <html>
    <head>
        <title>Svampe-Radar Horsens & Omegn</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f9; }
            header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
            #map { height: 80vh; width: 100%; }
            .footer { text-align: center; padding: 10px; color: #7f8c8d; font-size: 12px; }
        </style>
    </head>
    <body>
        <header>
            <h2>🍄 Danmarks Svampe-Radar (26-08-2026)</h2>
        </header>
        <div id="map"></div>
        <div class="footer">Opdateret automatisk via Open-Meteo & GitHub Actions</div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            var map = L.map('map').setView([55.8715, 9.8242], 11);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            var hjem = L.marker([55.8715, 9.8242]).addTo(map);
            hjem.bindPopup("<b>🏡 Min Bopæl (Viborgvej 15)</b>");
    
            L.circleMarker([55.8645, 9.7925], {
                color: 'green',
                radius: 10,
                fillOpacity: 0.8
            }).addTo(map).bindPopup("<b>Bygholm Skov / Åbjergskoven</b><br>Afstand: 2.1 km<br><b>Samlet Boom: 0%</b><br>• Kantarel: 0%<br>• Rørhat: 0%<br>• Champignon: 0%<br>Jordtemp: 0.0°C");
        
            L.circleMarker([55.9012, 9.839], {
                color: 'green',
                radius: 10,
                fillOpacity: 0.8
            }).addTo(map).bindPopup("<b>Hansted Skov</b><br>Afstand: 3.4 km<br><b>Samlet Boom: 0%</b><br>• Kantarel: 0%<br>• Rørhat: 0%<br>• Champignon: 0%<br>Jordtemp: 0.0°C");
        
            L.circleMarker([55.842, 9.884], {
                color: 'green',
                radius: 10,
                fillOpacity: 0.8
            }).addTo(map).bindPopup("<b>Boller Skov</b><br>Afstand: 5.0 km<br><b>Samlet Boom: 0%</b><br>• Kantarel: 0%<br>• Rørhat: 0%<br>• Champignon: 0%<br>Jordtemp: 0.0°C");
        
            L.circleMarker([55.918, 10.012], {
                color: 'green',
                radius: 10,
                fillOpacity: 0.8
            }).addTo(map).bindPopup("<b>Søvind Skov / Sondrup Bakker</b><br>Afstand: 12.8 km<br><b>Samlet Boom: 0%</b><br>• Kantarel: 0%<br>• Rørhat: 0%<br>• Champignon: 0%<br>Jordtemp: 0.0°C");
        
            L.circleMarker([56.045, 9.325], {
                color: 'green',
                radius: 10,
                fillOpacity: 0.8
            }).addTo(map).bindPopup("<b>Gludsted Plantage (Sandet)</b><br>Afstand: 36.6 km<br><b>Samlet Boom: 0%</b><br>• Kantarel: 0%<br>• Rørhat: 0%<br>• Champignon: 0%<br>Jordtemp: 0.0°C");
        
        </script>
    </body>
    </html>
